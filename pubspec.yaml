name: observatory
description: >-
  Isolate-aware Flutter logs, bounded history, safe HTTP logging
  and Sentry incident capture.
version: 3.0.1
repository: https://github.com/pchkauu/observatory
homepage: https://github.com/pchkauu/observatory
issue_tracker: https://github.com/pchkauu/observatory/issues

topics:
  - observability
  - logging
  - diagnostics
  - isolates
  - monitoring

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  bloc_effects: ^2.1.0
  dio: ^5.11.0
  domain_error: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  launch_mode: ^0.2.0
  package_context: ^2.2.0
  sentry_dio: ^9.28.0
  sentry_flutter: ^9.28.0
  talker: ^5.1.20
  talker_bloc_effects: ^0.1.0
  talker_flutter: ^5.1.20

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
